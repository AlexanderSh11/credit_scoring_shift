stages:
  generate_application_features:
    cmd: python ../src/app/modelling/features/application_features.py
    deps:
      - ../src/app/modelling/features/application_features.py
      - ../src/app/utils/db_manager.py
    outs:
      - ../src/app/modelling/features/data/application_features.csv
  generate_bureau_features:
    cmd: python ../src/app/modelling/features/bureau_features.py
    deps:
      - ../src/app/modelling/features/bureau_features.py
      - ../src/app/utils/db_manager.py
    outs:
      - ../src/app/modelling/features/data/bureau_features.csv
  generate_bureau_balance_features:
    cmd: python ../src/app/modelling/features/bureau_balance_features.py
    deps:
      - ../src/app/modelling/features/bureau_balance_features.py
      - ../src/app/utils/db_manager.py
    outs:
      - ../src/app/modelling/features/data/bureau_balance_features.csv