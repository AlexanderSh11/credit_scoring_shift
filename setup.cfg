[flake8]
max-line-length = 109

# WPS432: Ошибка magic number требует создания большого количества констант,
# что ухудшит читаемость кода.
# Большинство этих чисел не используется более 1 раза
# В константы были вынесены только числа, используемые часто или требуемые быстрых изменений
# WPS459: В коде нет сравнения == для float, поэтому ошибка избыточна,
# при сравнении float с помощью >, < ошибок нет, использование epsilon не требуется
per-file-ignores =
    src/app/core/calculator.py: WPS432, WPS459